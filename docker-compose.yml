# 后端四件套：MySQL + Redis + MinIO + API。
#
# 本地起法（与本机原生服务错开端口）：
#   colima start && docker compose up -d --build
#   MySQL→3307  Redis→6380  MinIO→9002/9003  API→8080
#
# 上服务器改成标准端口再起（原生服务不会和容器抢）：
#   export MYSQL_PORT=3306 REDIS_PORT=6379 MINIO_PORT=9000 MINIO_CONSOLE_PORT=9001
#   docker compose up -d --build
#
# 密钥全部从根目录 .env 读取（compose 会自动加载）；容器内部用服务名互相寻址，
# 所以 DB_URL / REDIS_HOST / MINIO_ENDPOINT 在 environment 里覆盖成了容器网络地址。

services:
  mysql:
    image: mysql:8.0
    container_name: hw-mysql
    environment:
      MYSQL_DATABASE: homework_grader
      MYSQL_USER: homework_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/docker/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hw-redis
    volumes:
      - ./data/docker/redis:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO 社区版 2025 起停止发布：官方镜像下架、dl.min.io 归档 410。
    # elestio 打包的是社区版最后一个官方构建（RELEASE.2025-09-07），S3 协议完全一致。
    image: elestio/minio:latest
    container_name: hw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./data/docker/minio:/data
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: hw-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器内寻址：服务名直连，不走宿主机端口
      DB_URL: jdbc:mysql://mysql:3306/homework_grader?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      # 预签名 Host 参与签名，必须用「客户端可达」的地址签，不能用容器内部地址
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT:-http://127.0.0.1:9002}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
